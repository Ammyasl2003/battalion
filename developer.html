        .circle, .circle2 {

            height: 100px;
            border-radius: 50%;

      }
      H3{
        text-align: center;

      }
      input[type="text"],
      input[type="date"],
      button {
          font-size: 1.2rem;
          padding: 10px;
          margin: 5px 0;
          border: 1px solid #ccc;
          border-radius: 4px;
          width: 40%;
          margin-top: 1%;
          margin-left: 30%;
          box-sizing: border-box;
      }
      button {
          background-color: navy;
          color: white;
          cursor: pointer;
          transition: background-color 0.3s;
      }
      button:hover {
          background-color: blue;
      }
      .nav {
          background-color: rgb(57, 57, 253);
          width: 100%;
      }
      .nav a {
          margin-left: 20%;
          color: white;
          text-decoration: none;
          font-size: 1.5rem;
      }
      .image-preview {
          max-width: 100%;
          max-height: 200px;
          margin-top: 10px;
          display: none;
          border-radius: 4px;
      }
